services:
  - type: web
    name: patentgraph-backend
    runtime: python
    region: singapore
    plan: free
    # Install CPU-only PyTorch first (smaller, no CUDA needed), then the rest
    buildCommand: >
      pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install --no-cache-dir -r backend/requirements.txt
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: ENVIRONMENT
        value: production

      # ── MongoDB Atlas ────────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false          # Set manually in Render dashboard
      - key: MONGODB_DB_NAME
        value: patentgraph_db
      - key: MONGODB_COLLECTION
        value: patents

      # ── Neo4j Aura ──────────────────────────────────────────────────────
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false

      # ── Qdrant Cloud ─────────────────────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: patent_embeddings

      # ── Groq LLM ─────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: LLM_PROVIDER
        value: groq

      # ── RAG Settings ─────────────────────────────────────────────────────
      - key: RAG_TOP_K
        value: "10"
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.25"
      - key: RAG_MAX_CONTEXT_TOKENS
        value: "3000"
      - key: RAG_ENABLE_DEBUG_LOGGING
        value: "false"

      # ── CORS: allow your Vercel frontend URL ─────────────────────────────
      # Replace YOUR_APP.vercel.app with your actual Vercel URL after first deploy
      - key: CORS_ORIGINS
        value: '["https://YOUR_APP.vercel.app","http://localhost:5173","http://localhost:3000"]'
